name: Auto Update Xtream Codes

on:
  schedule:
    # Berjalan otomatis setiap hari jam 00:00 UTC (Bisa disesuaikan menggunakan format Cron)
    - cron: '0 0 * * *'
  workflow_dispatch: # Membuat tombol agar bisa dijalankan manual kapan saja

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout repositori agar GitHub Actions bisa membaca dan menulis file
    - name: Checkout Repository
      uses: actions/checkout@v4

    # 2. Setup environment Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    # 3. Install library yang dibutuhkan
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

   # 4. Jalankan skrip Python dengan memasukkan Secrets sebagai Environment Variables
    - name: Run Update Script
      env:
        XTREAM_URL: ${{ secrets.XTREAM_URL }}
        XTREAM_USER: ${{ secrets.XTREAM_USER }}
        XTREAM_PASS: ${{ secrets.XTREAM_PASS }}
      run: python update_xtream.p

   # 5. Commit dan Push file hasil ekspor kembali ke GitHub jika file berhasil terbuat
    - name: Commit and Push Changes
      run: |
        # Memastikan file playlist.m3u benar-benar ada sebelum menjalankan Git
        if [ -f "playlist.m3u" ]; then
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add playlist.m3u
          
          # Hanya commit jika ada perubahan konten pada file
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update playlist: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
        else
          echo "Error: File playlist.m3u tidak ditemukan. Skrip Python kemungkinan gagal mengunduh data."
          exit 1
        fi
